<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FBG Schuljahr – Vorschau v5.0</title>
<style>
  /* Entwurf der neuen Oberfläche. Keine Funktionen, keine echten Daten. */
  :root{
    --bg:#f6f7f9; --card:#ffffff; --panel:#f8fafc;
    --ink:#111827; --ink-2:#374151; --muted:#6b7280;
    --line:#e5e7eb; --line-2:#d1d5db;
    --accent:#4f46e5; --accent-2:#4338ca; --accent-soft:#eef2ff;
    --ok:#047857; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
    --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
    --err:#b91c1c; --err-bg:#fef2f2; --err-line:#fecaca;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1216; --card:#171b21; --panel:#1c2129;
      --ink:#e8eaed; --ink-2:#c3c8d0; --muted:#98a1ae;
      --line:#282f39; --line-2:#39424f;
      --accent:#818cf8; --accent-2:#a5b4fc; --accent-soft:#1e213a;
      --ok:#6ee7b7; --ok-bg:#0e2a22; --ok-line:#14513f;
      --warn:#fcd34d; --warn-bg:#2b2213; --warn-line:#5b4519;
      --err:#fca5a5; --err-bg:#2c1618; --err-line:#5b2326;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
  .headwrap{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:17px;font-weight:650}
  header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
  .vers{font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-left:8px}
  .entwurf{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);
    border-radius:999px;padding:3px 11px;font-size:12px;font-weight:650}
  .suchbox{flex:0 1 300px;min-width:200px}
  .suchbox input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:13.5px;background:var(--card);color:var(--ink)}

  /* Ebene 1: Hauptreiter */
  .hauptnav{background:var(--card);border-bottom:1px solid var(--line)}
  .hauptnav .innen{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
  .hauptnav button{border:0;background:none;padding:12px 16px;font-size:14px;font-weight:600;color:var(--muted);
    cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
  .hauptnav button:hover{color:var(--ink)}
  .hauptnav button.aktiv{color:var(--accent);border-bottom-color:var(--accent)}
  .hauptnav button.fertig::after{content:" ✓";color:var(--ok)}

  /* Ebene 2: Unterreiter, nur wo es Personengruppen gibt */
  .unternav{max-width:1320px;margin:0 auto;padding:0 24px}
  .unternav:not(:empty){padding:10px 24px;display:flex;align-items:center}
  .unternav .wer{font-size:13px;color:var(--muted);margin-right:12px;font-weight:600}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:7px 18px;font-size:14px;cursor:pointer;
    color:var(--muted);border-radius:999px;font-family:inherit}
  .seg button:hover{color:var(--ink)}
  .seg button.aktiv{background:var(--accent);color:#fff;font-weight:600}

  /* Ebene 3: Seitenleiste + Inhalt */
  .rahmen{max-width:1320px;margin:0 auto;padding:18px 24px 60px;display:grid;
    grid-template-columns:290px 1fr;gap:22px;align-items:start}
  .rahmen.ohneLeiste{grid-template-columns:1fr}
  aside{position:sticky;top:var(--kopf,134px);background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px 8px;box-shadow:var(--shadow);max-height:calc(100vh - var(--kopf,134px) - 16px);overflow:auto}
  .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    padding:12px 10px 4px}
  .grp:first-child{padding-top:4px}
  .eintrag{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;
    padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer;font-family:inherit}
  .eintrag:hover{background:var(--panel)}
  .eintrag.aktiv{background:var(--accent-soft);color:var(--accent);font-weight:650}
  .eintrag .hk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;
    display:inline-flex;align-items:center;justify-content:center;font-size:10px}
  .eintrag.erledigt .hk{background:var(--ok);border-color:var(--ok);color:#fff}
  .eintrag.erledigt .hk::before{content:"✓"}
  .eintrag .fehlt{margin-left:auto;font-size:10.5px;color:var(--warn);font-weight:700}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 14px;font-size:16px;font-weight:650;display:flex;align-items:center;gap:9px}
  .num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
    padding:0 7px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700}
  .muted{color:var(--muted)}
  .platzhalter{border:2px dashed var(--line-2);border-radius:var(--radius-sm);padding:26px;text-align:center;
    color:var(--muted);font-size:13.5px;margin-top:14px;background:var(--panel)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
  .chip.da{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
  .chip.weg{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}
  .meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px;margin-top:4px}
  .meta b{color:var(--muted);font-weight:600}
  .fuss{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .btn{border:1px solid var(--line-2);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:9px;
    font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.prim{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  .box{border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;margin-top:12px}
  .box.warn{background:var(--warn-bg);border:1px solid var(--warn-line)}
  .box.info{background:var(--accent-soft);border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .st{font-weight:650;white-space:nowrap}
  .st.ok{color:var(--ok)} .st.alt{color:var(--warn)} .st.fehlt{color:var(--err)}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--panel);padding:1px 5px;border-radius:5px}

  /* Schrittkopf: Anleitung aus SCHRITTE direkt an der Karte */
  .schritt{background:var(--accent-soft);border-radius:var(--radius-sm);padding:10px 14px;margin:-4px 0 14px;font-size:13.5px}
  .skopf{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .skopf .dauer{font-weight:650;white-space:nowrap;color:var(--accent)}
  .skopf span:nth-child(2){flex:1;min-width:240px}
  .hkl{margin-left:auto;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:600}
  .schritt > .hkl{float:right}
  .anl{margin-top:6px}
  .anl summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
  .anl ol{margin:6px 0 2px;padding-left:22px} .anl p{margin:6px 0 2px}
  .anl textarea{width:100%;min-height:60px;margin-top:6px;padding:8px;border:1px solid var(--line-2);border-radius:8px;
    font-family:inherit;font-size:13px;background:var(--card);color:var(--ink)}
  /* Etiketten für die Zielsysteme */
  .sys{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .card h2 .sys{margin-left:6px}
  .sys-MS365{color:#2563eb} .sys-Jamf{color:#7c3aed} .sys-IServ{color:#0d9488}
  .sys-WebUntis{color:#c2410c} .sys-SchILD{color:#4d7c0f}
  .eintrag .txt{flex:1;min-width:0}
  .eintrag .sym{width:16px;text-align:center;flex:none;font-size:12px}
  .eintrag.art-warten,.eintrag.art-link{color:var(--muted);font-style:italic}
  .gruppe{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 10px}
  .gruppe:first-child{margin-top:0}
  .warte{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--line-2);border-radius:var(--radius-sm);
    padding:10px 14px;margin-bottom:20px;font-size:13.5px;background:var(--panel)}
  .warte.link{border-style:solid;background:var(--accent-soft)}
  .card,.warte{scroll-margin-top:140px;transition:box-shadow .3s}
  .blink{box-shadow:0 0 0 3px var(--accent)}
</style>
</head>
<body>
<header><div class="headwrap">
  <div style="flex:1;min-width:240px">
    <h1>FBG Schuljahr <span class="vers">v5.0 Vorschau</span></h1>
    <p>Nur ein Entwurf der Oberfläche. Knöpfe tun nichts, alle Daten sind erfunden.</p>
  </div>
  <div class="suchbox"><input type="text" placeholder="Suchen: Vorgang, Schritt, Karte …" disabled></div>
  <span class="entwurf">Entwurf</span>
</div>
<nav class="hauptnav"><div class="innen" id="hauptnav"></div></nav>
<div class="unternav" id="unternav"></div></header>
<div class="rahmen" id="rahmen">
  <aside id="leiste"></aside>
  <section>
    <div id="inhalt"></div>
  </section>
</div>

<script>
/* ---------- Datenquellen: alles, was das Tool einliest ---------- */
const QUELLEN = {
  schildS: {titel:'SchILD-Export Schüler', erkennt:'Kopfzeile mit „Interne ID-Nummer“ und „Klasse“',
            datei:'SchILD_Schueler_2026-10-07.txt', stand:'07.10.2026', zeilen:'812 Zeilen', status:'ok'},

            datei:'SchILD_Lehrer_2026-08-20.txt', stand:'20.08.2026', zeilen:'74 Zeilen', status:'alt'},
  ibiza:   {titel:'Ibiza-Kursexport (EP/Q1/Q2)', erkennt:'7er-Blöcke ab Spalte 7',
            datei:'Ibiza_EP_2026-09-15.txt', stand:'15.09.2026', zeilen:'118 Zeilen', status:'ok'},
  konten:  {titel:'MS365-Kontenbestand (Fenster 1)', erkennt:'Kopfzeile mit „UserPrincipalName“ und „Mail“',
            datei:'Kontenbestand_2026-10-08.csv', stand:'08.10.2026', zeilen:'934 Zeilen', status:'ok'},
  vert:    {titel:'Verteiler-Export (Fenster 2)', erkennt:'Kopfzeile mit „Verteiler“ und „Name“',
            datei:'', stand:'', zeilen:'', status:'fehlt'},
  jamfS:   {titel:'Jamf-Benutzerexport', erkennt:'Kopfzeile mit „Username“ und „Groups“',
            datei:'Jamf_Users_2026-09-30.csv', stand:'30.09.2026', zeilen:'801 Zeilen', status:'ok'},
  jamfL:   {titel:'Jamf-Lehrerexport', erkennt:'Kopfzeile mit „Username“ und „Teacher“',
            datei:'', stand:'', zeilen:'', status:'fehlt'},
  untis:   {titel:'WebUntis-Stammdatenbericht Schüler', erkennt:'Spalte „externKey“',
            datei:'Untis_Stammdaten_2026-09-02.csv', stand:'02.09.2026', zeilen:'806 Zeilen', status:'ok'}
};

/* ---------- Gliederung: Hauptreiter → (Unterreiter) → Seitenleiste ----------
   Seitenleiste in Arbeitsreihenfolge. sys = Etikett für das Zielsystem.
   art: 'karte' (Standard), 'warten' (Schritt ohne Karte), 'link' (Karte liegt woanders). */

    K('teams','Verteiler und Teams','MS365','Reiter 1, Karte 2','Kollegiumsverteiler, Kollegiumsteam, Lernbegleitung.'),
    K('vorschau','Daten prüfen und Vorschau','','Reiter 1, Karten 3 und 4',wer+' aus dem SchILD-Export, mit Warnungen.',['schildL']),
  ]},
  {grp:'Anlegen', items:[
    K('ms365','MS365 Benutzer anlegen','MS365','Reiter 1, Karte 5','Konten, Lizenzen, Verteiler, Teams.',['schildL']),
    W('postfach','Postfächer abwarten','15 Minuten bis 1 Stunde, dann stichprobenartig prüfen.'),
    K('jamf','Jamf Benutzer anlegen','Jamf','Reiter 1, Karte 5','Benutzerimport für Jamf School.',['schildL']),
    K('iserv','IServ Benutzer anlegen','IServ','Reiter 1, Karte 5','Vollimport in IServ.',['schildL']),
  ]},
  {grp:'Abschluss', items:[
    K('briefe','Briefe und Mailtexte','','Reiter 1, Karte 6','Zugangsdaten zum Übergeben.',['schildL']),
    W('aufraeumen','Dateien mit Passwörtern löschen','Auch aus dem Papierkorb.'),
  ]},
];

const NAV = [
 {id:'start', titel:'Start', leiste:[
   {grp:'Überblick', items:[
     K('heute','Was jetzt ansteht','','Reiter 0, oben','Erinnerungen und der Stand der Vorgänge.'),
     K('daten','Daten einlesen','','neu (heute einzeln in jeder Karte)','Alle Dateien an einer Stelle.'),
   ]},
   {grp:'Anleitungen', items:[
     K('ablaeufe','Abläufe und Anleitungen','','Reiter 0, Karte gleichen Namens','Die Vorgänge mit ihren Schritten, Haken und Notizen.'),
     K('systeme','Welcher Vorgang berührt welches System','','Reiter 0, Karte gleichen Namens','Die Übersichtstabelle.'),
   ]},
   {grp:'Einmalig', items:[

   ]},
 ]},
 {id:'zugang', titel:'Benutzer anlegen', unter:[
   {id:'schueler', titel:'Schüler', leiste:[
     {grp:'Vorbereitung', items:[
       K('sichern','Kontenbestand sichern','MS365','Reiter 1, Karte 1','Den Ist-Zustand der Konten wegschreiben, bevor etwas geändert wird.'),
       K('vorschau','Daten prüfen und Vorschau','','Reiter 1, Karten 3 und 4','Zeigt die Schüler aus dem SchILD-Export, mit Warnungen.',['schildS']),
     ]},
     {grp:'Anlegen', items:[
       K('ms365','MS365 Benutzer anlegen','MS365','Reiter 1, Karte 5, Abschnitt PowerShell','Das PowerShell-Skript für Konten und Lizenzen.',['schildS']),
       W('postfach','Postfächer abwarten','15 Minuten bis 1 Stunde. Erst dann gehen Verteiler.'),
       K('klFuellen','Klassenverteiler füllen','MS365','Reiter 2, Karte 6','Neue Klassen anlegen und Schüler aufnehmen.',['schildS']),
       K('jamf','Jamf Benutzer anlegen','Jamf','Reiter 1, Karte 5, Abschnitt Jamf','Benutzerimport, ersetzt Klassen und Gruppen. Darin aufgeklappt: Jamf-Benutzernamen abgleichen (nur bei Bedarf).',['schildS']),
       K('iserv','IServ Benutzer anlegen','IServ','Reiter 1, Karte 5, Abschnitt IServ','Vollimport, überschreibt die Klassen.',['schildS']),
       K('wui','Office-365-Identität nachtragen','WebUntis','Werkzeugkasten, Karte 4','Damit die Anmeldung per SSO läuft.',['untis','konten']),
     ]},
     {grp:'Abschluss', items:[
       K('briefe','Briefe und Mailtexte','','Reiter 1, Karte 6','Serienbriefe mit den Zugangsdaten.',['schildS']),
       K('sri','Mailadressen zurück nach SchILD','SchILD','Werkzeugkasten, Karte 3','Importdatei für den ExternImport.',['schildS','konten']),

     ]},
   ]},
   {id:'lehrer', titel:'Lehrkräfte', leiste:LEHRKRAFT('Neue Lehrkräfte')},
   {id:'ref', titel:'Referendare', hinweis:'Arbeitet genauso wie „Lehrkräfte“, nur eigener Einstieg.', leiste:LEHRKRAFT('Neue Referendarinnen und Referendare')},
   {id:'prak', titel:'Praktikanten', leiste:[
     {grp:'Aufnehmen', items:[
       K('prakNamen','Namen eintragen','','Reiter 1, Bereich Praktikum','Kohorte, Namen, Enddatum. Kommt nicht aus SchILD.'),
       K('ms365','MS365 Benutzer anlegen','MS365','Reiter 1, Karte 5','Befristete MS365-Konten mit Kennung PRAKT-….'),

       K('briefe','Zugangsdaten übergeben','','Reiter 1, Karte 6','Brief oder Mailtext.'),
       W('aufraeumen','Dateien mit Passwörtern löschen','Auch aus dem Papierkorb.'),
     ]},
     {grp:'Praktikum beenden', items:[
       K('prakBlick','Praktika im Blick','MS365','Werkzeugkasten, Karte 3','Abgelaufene finden, abmelden, nach der Frist löschen.'),
     ]},
   ]},
 ]},
 {id:'wechsel', titel:'Schuljahreswechsel', leiste:[
   {grp:'Sommer: Verteiler versetzen', items:[
     K('vsichern','Verteiler sichern','MS365','Reiter 2, Karte 1','Vor allem anderen.'),
     K('zuordnung','Zuordnung','MS365','Reiter 2, Karte 2','Welche Klasse wird zu welcher.'),
     K('pruefung','Reihenfolge und Prüfung','MS365','Reiter 2, Karte 3','Damit nichts überschrieben wird.'),
     K('skript','Skript','MS365','Reiter 2, Karte 4','Das Versetzungsskript.'),
     K('leitung','Klassenleitungen aktualisieren','MS365','Reiter 2, Karte L','Nach dem Versetzen.',['schildL']),
   ]},
   {grp:'Sommer: neue Schüler', items:[

     W('abgaenge','Abgänge behandeln','Admin Center oder PowerShell.'),
     K('nachlauf','Nachlauf','','Werkzeugkasten, Karte 1','Kontrollbefehle und Aufräumen.'),
   ]},
   {grp:'Herbst: Oberstufenkurse', items:[
     L('zuJamfNamen','Jamf-Benutzernamen abgleichen','Benutzer anlegen → Schüler','Steckt in „Jamf Benutzer anlegen“, Abschnitt zum Aufklappen.'),

 ]},
 {id:'pflege', titel:'Prüfen & Pflegen', leiste:[
   {grp:'Klassenabgleich', items:[
     K('abgAnleit','So gehst du vor','','Reiter 3, Karte gleichen Namens','Die 14 Schritte aus der Anleitung.'),
     K('abgLesen','Ist-Zustand auslesen','MS365','Reiter 3, Karte 1','Zwei PowerShell-Fenster.'),
     K('abgVergl','Dateien laden und vergleichen','','Reiter 3, Karte 2','SchILD gegen die Verteiler.',['schildS','konten','vert']),
     K('abgErg','Ergebnis und Korrekturskript','MS365','Reiter 3, Karte 3','6_Klassenwechsel.ps1, ändert nur Verteiler.'),
     K('vgl','Zwei SchILD-Exporte vergleichen','SchILD','Reiter 3, Karte 4','Ohne Tenant, rein lokal.'),
   ]},
   {grp:'Im laufenden Jahr', items:[
     K('klw','Klassenleitung wechseln','MS365','Werkzeugkasten, Karte 5','Einzelne Klassen, mitten im Schuljahr.'),
     K('guid','SchILD-Kennung bei Altkonten nachtragen','MS365','Werkzeugkasten, Karte 3','Für Konten von vor dem Tool.',['schildS','konten']),
   ]},
 ]},
 {id:'einst', titel:'Einstellungen', leiste:[
   {grp:'Einstellungen', items:[
     K('einmal','Einmal einrichten','','Reiter 5, Karte 1','Domains, Lizenzen, Zielsysteme.'),
     K('jaehrlich','Jedes Jahr prüfen','','Reiter 5, Karte 2','Jahrgänge und Oberstufe.'),
     K('datenordner','Datenordner','','neu','Wo das Tool die Exporte sucht.'),
     K('selbsttest','Selbsttest','','Reiter 5, Karte „Selbsttest“','Prüft das Tool. Muss grün sein.'),
   ]},
 ]},
];

/* ---------- Anleitung je Karte: kommt im echten Tool aus SCHRITTE ----------
   Beispieltexte, gekürzt. dauer, zweck, anleitung[] und warum wie in SCHRITTE. */
const ANL = {
  ms365:   {dauer:'30 Minuten', zweck:'Aus dem SchILD-Export entstehen Adressen und Passwörter, das Skript legt die Konten in MS365 an und weist die Lizenzen zu.',
            schritte:['SchILD-Export laden (Start → Daten einlesen).','Vorschau und Warnungen durchsehen.','Skript herunterladen und in PowerShell 7 ohne Parameter starten: nur Simulation.','Läuft alles sauber: noch einmal mit -Live starten.'],
            warum:'Die Grundlizenz muss Exchange enthalten, sonst entsteht kein Postfach und die Kinder lassen sich später nicht in die Klassenverteiler aufnehmen.'},
  postfach:{dauer:'15 Minuten bis 1 Stunde', zweck:'Erst wenn die Postfächer da sind, lassen sich die Konten in Verteiler aufnehmen.',
            schritte:['Zwei, drei neue Adressen im Admin Center aufrufen.','Hat jede ein Postfach: weiter mit dem nächsten Schritt.']},
  jamf:    {dauer:'10 Minuten', zweck:'Legt die Benutzer in Jamf School an und setzt dabei Klassen und Gruppen neu.',
            schritte:['Jamf-Datei herunterladen.','Jamf School → Benutzer → Import.','Immer alle Jahrgänge importieren, nie nur die neuen.'],
            warum:'Der Import ersetzt die Gruppen aller Personen, die in der Datei stehen. Wer fehlt, behält seine alten Gruppen.'},
  iserv:   {dauer:'10 Minuten', zweck:'Legt die Benutzer in IServ an und setzt die Klassen.',
            schritte:['IServ-Datei herunterladen (.csv).','IServ → Verwaltung → Import, Profil wählen.','Als Vollimport starten.']},
  abgLesen:{dauer:'5 Minuten', zweck:'Holt den Ist-Zustand aus MS365 und Exchange.',
            schritte:['Fenster 1 (Graph): Befehl kopieren und starten.','Fenster 2 (Exchange): Befehl kopieren und starten.','Beide Dateien landen im Download-Ordner.']},
  prakNamen:{dauer:'5 Minuten', zweck:'Die Praktikanten kommen nicht aus SchILD, sie werden hier eingetragen.',
            schritte:['Kohorte wählen, z. B. 2026-2.','Namen und Enddatum eintragen.','Vorschau prüfen.']},
};

/* ---------- Zustand der Vorschau ---------- */
const S = {haupt:'start', unter:{zugang:'schueler'}, erledigt:new Set(['vsichern','zuordnung','pruefung','skript'])};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function aktBereich(){
  const h = NAV.find(n => n.id===S.haupt);
  if(!h.unter) return {h, b:h};
  return {h, b:h.unter.find(x => x.id===S.unter[h.id]) || h.unter[0]};
}
const alleItems = b => b.leiste.flatMap(g => g.items);
const sysTag = s => s ? `<span class="sys sys-${s}">${esc(s)}</span>` : '';

function kopfHoehe(){
  const h = document.querySelector('header').offsetHeight + 14;
  document.documentElement.style.setProperty('--kopf', h+'px'); return h;
}
function zeichne(){
  $('hauptnav').innerHTML = NAV.map(n =>
    `<button class="${n.id===S.haupt?'aktiv':''}" onclick="wahlHaupt('${n.id}')">${esc(n.titel)}</button>`).join('');

  const {h, b} = aktBereich();
  $('unternav').innerHTML = h.unter
    ? `<span class="wer">Du arbeitest an:</span><div class="seg">${h.unter.map(u => `<button class="${u===b?'aktiv':''}" onclick="wahlUnter('${h.id}','${u.id}')">${esc(u.titel)}</button>`).join('')}</div>`
      + (b.hinweis ? `<span class="muted" style="font-size:13px;margin-left:12px">${esc(b.hinweis)}</span>` : '')
    : '';

  // Seitenleiste: Nummern nur für echte Karten, wie heute
  let nr = 0;
  $('leiste').innerHTML = b.leiste.map(g =>
    `<div class="grp">${esc(g.grp)}</div>` + g.items.map(i => {
      if(i.art==='karte') i.nr = ++nr;
      const fehlt = i.braucht.some(q => QUELLEN[q].status==='fehlt');
      const vor = i.art==='warten' ? '<span class="sym">⏳</span>' : i.art==='link' ? '<span class="sym">↗</span>' : '<span class="hk"></span>';
      return `<button class="eintrag art-${i.art} ${S.erledigt.has(i.id)?'erledigt':''}" data-ziel="k_${i.id}" onclick="springeKarte('${i.id}')">`
        + vor + `<span class="txt">${esc(i.titel)}</span>`
        + (fehlt ? '<span class="fehlt" title="Datei fehlt">Daten?</span>' : sysTag(i.sys)) + '</button>';
    }).join('')
  ).join('');

  // Inhalt: alle Karten untereinander
  $('inhalt').innerHTML = b.leiste.map(g =>
    `<div class="gruppe">${esc(g.grp)}</div>` + g.items.map(karte).join('')).join('');
  kopfHoehe(); beobachte();
}

function quelleChips(ids){
  if(!ids.length) return '<span class="muted">keine Datei nötig</span>';
  return '<div class="chips">' + ids.map(q => {
    const Q = QUELLEN[q];
    return `<span class="chip ${Q.status==='fehlt'?'weg':'da'}" onclick="zuDaten()" title="Zu Start → Daten einlesen">${Q.status==='fehlt'?'fehlt: ':'✓ '}${esc(Q.titel)}${Q.stand?' · '+Q.stand:''}</span>`;
  }).join('') + '</div>';
}

function schrittKopf(k){
  const a = ANL[k.id];
  const haken = `<label class="hkl"><input type="checkbox" ${S.erledigt.has(k.id)?'checked':''} onchange="hakeAb('${k.id}',this.checked)"> erledigt</label>`;
  if(!a) return `<div class="schritt"><span class="muted">Zu diesem Schritt gibt es noch keine Anleitung.</span>${haken}</div>`;
  return `<div class="schritt">
      <div class="skopf"><span class="dauer">⏱ ${esc(a.dauer)}</span><span>${esc(a.zweck)}</span>${haken}</div>
      ${a.schritte?`<details class="anl"><summary>Anleitung · ${a.schritte.length} Schritte</summary><ol>${a.schritte.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol></details>`:''}
      ${a.warum?`<details class="anl"><summary>Warum das so ist</summary><p>${esc(a.warum)}</p></details>`:''}
      <details class="anl"><summary>Notiz</summary><textarea placeholder="Eigene Notiz zu diesem Schritt (wird im Stand gespeichert)"></textarea></details>
    </div>`;
}

function karte(k){
  if(k.art==='warten') return `<div class="warte" id="k_${k.id}"><span class="sym">⏳</span><b>${esc(k.titel)}</b> <span class="muted">${esc(k.was)}</span>`
    + (ANL[k.id]?`<details class="anl" style="flex-basis:100%;margin:4px 0 0 26px"><summary>Anleitung · ${ANL[k.id].schritte.length} Schritte</summary><ol>${ANL[k.id].schritte.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol></details>`:'')
    + `</div>`;
  if(k.art==='link')   return `<div class="warte link" id="k_${k.id}"><span class="sym">↗</span><b>${esc(k.titel)}</b> <span class="muted">${esc(k.was)}</span>
                                 <button class="btn" style="margin-left:auto" onclick="folgeLink('${k.id}')">Zu ${esc(k.ziel)}</button></div>`;
  if(k.id==='daten') return datenKarte(k);
  if(k.id==='heute') return heuteKarte(k);
  const fehlt = k.braucht.filter(q => QUELLEN[q].status==='fehlt');
  return `<div class="card" id="k_${k.id}">
    <h2><span class="num">${k.nr}</span> ${esc(k.titel)} ${sysTag(k.sys)}</h2>
    ${schrittKopf(k)}
    <div class="meta">
      <b>Was die Karte tut</b><span>${esc(k.was)}</span>
      <b>Heute zu finden</b><span>${esc(k.heute)}</span>
      <b>Braucht</b><span>${quelleChips(k.braucht)}</span>
    </div>
    ${fehlt.length ? `<div class="box warn">Für diesen Schritt fehlt noch eine Datei. <a href="#" onclick="zuDaten();return false">Zu „Daten einlesen“</a></div>` : ''}
    <div class="platzhalter">Hier steht später der Inhalt der heutigen Karte, unverändert.</div>
  </div>`;
}

function datenKarte(k){
  const zeilen = Object.values(QUELLEN).map(Q => {
    const st = Q.status==='ok' ? '<span class="st ok">✓ aktuell</span>'
             : Q.status==='alt' ? '<span class="st alt">⚠ älter als 4 Wochen</span>'
             : '<span class="st fehlt">✗ nicht gefunden</span>';
    return `<tr><td><b>${esc(Q.titel)}</b><div class="muted" style="font-size:12px">erkannt an: ${esc(Q.erkennt)}</div></td>
      <td>${Q.datei?`<code>${esc(Q.datei)}</code><div class="muted" style="font-size:12px">${esc(Q.zeilen)}</div>`:'–'}</td>
      <td>${esc(Q.stand||'–')}</td><td>${st}</td>
      <td><button class="btn" style="padding:4px 10px;font-size:12.5px">andere Datei …</button></td></tr>`;
  }).join('');
  return `<div class="card" id="k_${k.id}">
    <h2><span class="num">${k.nr}</span> Daten einlesen <span class="muted" style="font-weight:400">alle Dateien an einer Stelle · kommt erst in 5.1</span></h2>
    <div class="meta">
      <b>Datenordner</b><span><code>C:\\FBG-Daten</code> · <span class="muted">nur auf diesem Rechner, nicht der gemeinsame Ordner</span></span>
      <b>Zuletzt gelesen</b><span>09.10.2026, 08:14 Uhr</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn prim">Ordner neu einlesen</button>
      <button class="btn">Datenordner wählen …</button>
    </div>
    <table><thead><tr><th>Art</th><th>Datei (neueste)</th><th>Stand</th><th>Status</th><th></th></tr></thead><tbody>${zeilen}</tbody></table>
    <div class="box info"><b>So funktioniert es:</b> Das Tool schaut in den Datenordner, erkennt jede Datei an ihrer Kopfzeile
      (nicht am Dateinamen) und nimmt je Art die <b>neueste</b>. Über „andere Datei …“ wählst du für dieses eine Mal eine
      bestimmte Datei. Nach einem Neustart von Chrome fragt der Browser einmal, ob das Tool den Ordner lesen darf.</div>
    <div class="box warn"><b>Datenschutz:</b> Die Exporte enthalten echte Schülerdaten. Sie gehören in einen eigenen Ordner auf
      diesem Rechner, nicht in den gemeinsamen Ordner. Dort liegt weiter nur <code>FBG_Schuljahr_Stand.json</code>.</div>
  </div>`;
}

function heuteKarte(k){
  const fehlt = Object.values(QUELLEN).filter(q => q.status!=='ok');
  return `<div class="card" id="k_${k.id}">
    <h2><span class="num">${k.nr}</span> Was jetzt ansteht</h2>
    <div class="box info">Abgleich der Klassenverteiler ist fällig (4 Wochen nach „Verteiler versetzen“).
      <a href="#" onclick="springe('pflege',null,'abgAnleit');return false">Zum Abgleich</a></div>
    ${fehlt.length?`<div class="box warn">${fehlt.length} Datenquellen fehlen oder sind alt: ${fehlt.map(q=>esc(q.titel)).join(', ')}.
      <a href="#" onclick="zuDaten();return false">Zu „Daten einlesen“</a></div>`:''}
    <div class="platzhalter">Hier steht später die heutige Startseite mit dem Stand der Vorgänge.</div>
  </div>`;
}

/* Seitenleiste markiert die Karte, die gerade oben im Bild ist */
let beob, sperre=0;
const marke = id => document.querySelectorAll('.eintrag').forEach(e => e.classList.toggle('aktiv', e.dataset.ziel===id));
function beobachte(){
  if(beob) beob.disconnect();
  const _m = id => document.querySelectorAll('.eintrag').forEach(e => e.classList.toggle('aktiv', e.dataset.ziel===id));
  beob = new IntersectionObserver(es => {
    const sicht = es.filter(e => e.isIntersecting).sort((a,b) => a.boundingClientRect.top-b.boundingClientRect.top);
    if(sicht.length && Date.now()>sperre) marke(sicht[0].target.id);
  }, {rootMargin:'-'+kopfHoehe()+'px 0px -60% 0px'});
  document.querySelectorAll('#inhalt [id^="k_"]').forEach(el => beob.observe(el));
  const erste = document.querySelector('#inhalt [id^="k_"]'); if(erste) marke(erste.id);
}

function springeKarte(id){
  const el = $('k_'+id); if(!el) return;
  marke('k_'+id); sperre = Date.now()+1000;   // beim Klick gewinnt der Klick, auch bei der letzten Karte
  scrollTo({top: el.getBoundingClientRect().top + scrollY - kopfHoehe(), behavior:'smooth'});
  el.classList.add('blink'); setTimeout(() => el.classList.remove('blink'), 1200);
}
function wahlHaupt(id){ S.haupt=id; zeichne(); scrollTo({top:0}); }
function wahlUnter(h,u){ S.unter[h]=u; zeichne(); scrollTo({top:0}); }
function hakeAb(id,an){ an?S.erledigt.add(id):S.erledigt.delete(id); const y=scrollY; zeichne(); scrollTo({top:y}); }
function springe(h,u,id){ S.haupt=h; if(u) S.unter[h]=u; zeichne(); setTimeout(() => springeKarte(id), 30); }
function folgeLink(id){ springe('zugang','schueler', id==='zuJamfNamen'?'jamf':'sichern'); }
function zuDaten(){ springe('start',null,'daten'); }

zeichne();
</script>
</body>
